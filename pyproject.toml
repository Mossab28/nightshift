[project]
name = "nightshift"
version = "0.1.0"
description = "The on-call data team that gets smarter every night."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "acryl-datahub>=1.0.0",
    "claude-agent-sdk>=0.1.0",
    "mcp>=1.2.0",
    "rich>=13.7",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "bcrypt>=4.0",
    "cryptography>=42",
    "pydantic[email]>=2.7",
]

[project.scripts]
nightshift = "nightshift.cli:app"
nightshift-mcp = "nightshift.mcp_server:main"
nightshift-demo = "nightshift.demo_server:main"
nightshift-app = "nightshift.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightshift"]
